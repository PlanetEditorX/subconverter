# acl4SSR规则

# 去广告：支持
# 自动测速：支持
# 微软分流：支持
# 苹果分流：支持
# 增强中国IP段：支持
# 增强国外GFW：支持

profile:
  store-selected: true

# DNS：使用加密上游，避免订阅自带的明文 DNS 覆盖本配置。
# AdGuard 为首选，Cloudflare/Google 仅作为网络不可用时的备用。
# 关闭 IPv6 DNS 返回，避免客户端从 IPv6 路径绕过规则。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "+.push.apple.com"
    - "mesu.apple.com"
    - "swscan.apple.com"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "connectivitycheck.android.com"
    - "www.msftconnecttest.com"
    - "www.msftncsi.com"
  respect-rules: true
  nameserver:
    - https://dns.adguard-dns.com/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
  proxy-server-nameserver:
    - https://dns.adguard-dns.com/dns-query
  direct-nameserver:
    - https://dns.adguard-dns.com/dns-query
  default-nameserver:
    - 94.140.14.14
    - 1.1.1.1

