dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1

proxy-providers:
  Sub-store:
    type: http
    url: "url"
    path: ./proxy_provider/provider_dialer.yaml
    proxy: DIRECT
    interval: 86400
    health-check:
      enable: true
      interval: 300
      url: https://g.cn/generate_204
    override:
      skip-cert-verify: true
      udp: true

anchor:
  # 原有自动测速组
  BaseURL-test: &BaseURL-test
    type: smart
    include-all: true
    tolerance: 20
    interval: 120
    url: https://cp.cloudflare.com/generate_204
    hidden: true

  BaseURL-control: &BaseURL-control
    type: smart
    include-all: true
    tolerance: 20
    interval: 120
    url: https://cp.cloudflare.com/generate_204

  BaseDIRECT: &BaseDIRECT
    type: select
    hidden: true

  # 地区内部自动测速组
  BaseRegionURLTest: &BaseRegionURLTest
    type: url-test
    include-all: true
    tolerance: 20
    interval: 120
    url: https://cp.cloudflare.com/generate_204

  # 地区优先级组：机场优先，免费备用
  BaseRegionFallback: &BaseRegionFallback
    type: fallback
    interval: 120
    url: https://cp.cloudflare.com/generate_204

  # 免费节点关键词：
  # EdgeTunnel、FreeSocks、免费、free
  FilterFreeName: &FilterFreeName
    'EdgeTunnel|FreeSocks|免费|free'

  # 机场节点关键词：
  # MM、霉霉、6B、牛逼
  FilterAirportName: &FilterAirportName
    'MM|霉霉|6B|牛逼'

  # 地区筛选
  FilterHK: &FilterHK
    '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$'

  FilterSG: &FilterSG
    '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$'

  FilterJP: &FilterJP
    '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK)).*$'

  FilterUS: &FilterUS
    '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$'

  FilterAI: &FilterAI
    '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|VPS|AI)).*$'

  FilterTW: &FilterTW
    '^(?=.*(?i)(台|🇹🇼|TW|tai|TPE|TSA|KHH)).*$'

  Filter6B: &Filter6B
    '^(?=.*(?i)(6B)).*$'

  FilterMM: &FilterMM
    '^(?=.*(?i)(MM)).*$'

  FilterVPS: &FilterVPS
    '^(?=.*(?i)(VPS)).*$'

  FilterBEST: &FilterBEST
    '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG|台|🇹🇼|TW|tai|TPE|TSA|KHH|日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK|坡|🇸🇬|SG|Sing|SIN|XSP)).*$'

  # 香港：机场
  FilterHKAirport: &FilterHKAirport
    '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?=.*(?i)(MM|霉霉|6B|牛逼)).*$'

  # 香港：免费
  FilterHKFree: &FilterHKFree
    '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG))(?=.*(?i)(EdgeTunnel|FreeSocks|免费|free)).*$'

  # 美国：机场
  FilterUSAirport: &FilterUSAirport
    '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?=.*(?i)(MM|霉霉|6B|牛逼)).*$'

  # 美国：免费
  FilterUSFree: &FilterUSFree
    '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?=.*(?i)(EdgeTunnel|FreeSocks|免费|free)).*$'

  # 日本：机场
  FilterJPAirport: &FilterJPAirport
    '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?=.*(?i)(MM|霉霉|6B|牛逼)).*$'

  # 日本：免费
  FilterJPFree: &FilterJPFree
    '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?=.*(?i)(EdgeTunnel|FreeSocks|免费|free)).*$'

  # 新加坡：机场
  FilterSGAirport: &FilterSGAirport
    '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?=.*(?i)(MM|霉霉|6B|牛逼)).*$'

  # 新加坡：免费
  FilterSGFree: &FilterSGFree
    '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP))(?=.*(?i)(EdgeTunnel|FreeSocks|免费|free)).*$'

  # 台湾：机场
  FilterTWAirport: &FilterTWAirport
    '^(?=.*(?i)(台|🇹🇼|TW|tai|TPE|TSA|KHH))(?=.*(?i)(MM|霉霉|6B|牛逼)).*$'

  # 台湾：免费
  FilterTWFree: &FilterTWFree
    '^(?=.*(?i)(台|🇹🇼|TW|tai|TPE|TSA|KHH))(?=.*(?i)(EdgeTunnel|FreeSocks|免费|free)).*$'

  # 普通策略组
  SelectAU: &SelectAU
    type: url-test
    include-all: true
    tolerance: 20
    interval: 120
    url: https://cp.cloudflare.com/generate_204
    filter: "^((?!(直连|DIRECT)).)*$"

  SelectMS: &SelectMS
    type: select
    proxies:
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 自动选择
      - VPS节点
      - MM节点
      - 6B节点
      - 全球直连
    use:
      - Sub-store

  SelectMH: &SelectMH
    type: select
    proxies:
      - 台湾节点
      - 香港节点
      - 美国节点
      - 新加坡节点
      - 日本节点
      - 手动选择
      - 自动选择
      - VPS节点
      - MM节点
      - 6B节点
      - 全球直连
    use:
      - Sub-store

  SelectHK: &SelectHK
    type: select
    proxies:
      - 香港节点
      - 美国节点
      - 日本节点
      - 新加坡节点
      - 台湾节点
      - 手动选择
      - 自动选择
      - VPS节点
      - MM节点
      - 6B节点
      - 全球直连

  SelectUS: &SelectUS
    type: select
    proxies:
      - 美国节点
      - AI节点
      - 香港节点
      - 新加坡节点
      - 日本节点
      - 台湾节点
      - 手动选择
      - 自动选择
      - VPS节点
      - MM节点
      - 6B节点
      - 全球直连

  SelectSG: &SelectSG
    type: select
    proxies:
      - 新加坡节点
      - 香港节点
      - 美国节点
      - 日本节点
      - 台湾节点
      - 手动选择
      - 自动选择
      - VPS节点
      - MM节点
      - 6B节点
      - 全球直连

  SelectJP: &SelectJP
    type: select
    proxies:
      - 日本节点
      - 香港节点
      - 美国节点
      - 新加坡节点
      - 台湾节点
      - 手动选择
      - 自动选择
      - VPS节点
      - MM节点
      - 6B节点
      - 全球直连

  SelectTW: &SelectTW
    type: select
    proxies:
      - 台湾节点
      - 香港节点
      - 美国节点
      - 新加坡节点
      - 日本节点
      - 手动选择
      - 自动选择
      - VPS节点
      - MM节点
      - 6B节点
      - 全球直连

  SelectAD: &SelectAD
    type: select
    proxies:
      - REJECT
      - DIRECT

  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

  class: &class
    type: http
    interval: 86400
    behavior: classical
    format: text


proxy-groups:
  - name: 手动选择
    <<: *SelectMS

  - name: 自动选择
    <<: *SelectAU

  # 香港：机场优先，免费备用
  - name: 香港机场
    <<: *BaseRegionURLTest
    filter: *FilterHKAirport

  - name: 香港免费
    <<: *BaseRegionURLTest
    filter: *FilterHKFree

  - name: 香港节点
    <<: *BaseRegionFallback
    proxies:
      - 香港机场
      - 香港免费

  # 美国：机场优先，免费备用
  - name: 美国机场
    <<: *BaseRegionURLTest
    filter: *FilterUSAirport

  - name: 美国免费
    <<: *BaseRegionURLTest
    filter: *FilterUSFree

  - name: 美国节点
    <<: *BaseRegionFallback
    proxies:
      - 美国机场
      - 美国免费

  # 日本：机场优先，免费备用
  - name: 日本机场
    <<: *BaseRegionURLTest
    filter: *FilterJPAirport

  - name: 日本免费
    <<: *BaseRegionURLTest
    filter: *FilterJPFree

  - name: 日本节点
    <<: *BaseRegionFallback
    proxies:
      - 日本机场
      - 日本免费

  # 新加坡：机场优先，免费备用
  - name: 新加坡机场
    <<: *BaseRegionURLTest
    filter: *FilterSGAirport

  - name: 新加坡免费
    <<: *BaseRegionURLTest
    filter: *FilterSGFree

  - name: 新加坡节点
    <<: *BaseRegionFallback
    proxies:
      - 新加坡机场
      - 新加坡免费

  # 台湾：机场优先，免费备用
  - name: 台湾机场
    <<: *BaseRegionURLTest
    filter: *FilterTWAirport

  - name: 台湾免费
    <<: *BaseRegionURLTest
    filter: *FilterTWFree

  - name: 台湾节点
    <<: *BaseRegionFallback
    proxies:
      - 台湾机场
      - 台湾免费

  # 其他服务分组
  - name: 即时通讯
    <<: *SelectHK

  - name: 社交媒体
    <<: *SelectHK

  - name: GitHub
    <<: *SelectHK

  - name: 开发服务
    <<: *SelectHK

  - name: Copilot
    <<: *SelectUS

  - name: ChatGPT
    <<: *SelectUS

  - name: Gemini
    <<: *SelectHK

  - name: AI服务
    <<: *SelectUS

  - name: 谷歌服务
    <<: *SelectHK

  - name: YouTube
    <<: *SelectSG

  - name: 国外媒体
    <<: *SelectSG

  - name: TikTok
    <<: *SelectUS

  - name: PayPal
    <<: *SelectUS

  - name: 苹果服务
    <<: *SelectHK

  - name: OneDrive
    <<: *SelectHK

  - name: 微软服务
    <<: *SelectHK

  - name: 游戏平台
    <<: *SelectHK

  - name: 测速工具
    <<: *SelectHK

  # VPS：独立测速
  - name: VPS节点
    <<: *BaseURL-control
    filter: *FilterVPS

  # 机场分类
  - name: MM节点
    <<: *BaseURL-control
    filter: *FilterMM

  - name: 6B节点
    <<: *BaseURL-control
    filter: *Filter6B

  - name: 优选节点
    <<: *BaseURL-control
    filter: *FilterBEST

  - name: 漏网之鱼
    <<: *SelectMH

  - name: 广告拦截
    <<: *SelectAD

  - name: 全球直连
    type: select
    proxies:
      - DIRECT


